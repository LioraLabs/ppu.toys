name: Deploy

# Main-branch deploys are GATED ON GREEN CI: this fires from CI's completion
# (workflow_run), not from the push itself. Tag pushes and manual dispatch
# deploy directly (CI does not run on tags; dispatch is a deliberate override).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

# Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key
# for a deploy user on the box with passwordless sudo for the swap below).
# Rollback one-liner:
#   ssh $DEPLOY_USER@$DEPLOY_HOST \
#     'sudo cp -a /opt/ppu/ppu-server.prev /opt/ppu/ppu-server; sudo cp -a /etc/caddy/Caddyfile.prev /etc/caddy/Caddyfile; sudo systemctl restart ppu-server; sudo systemctl reload caddy'
jobs:
  deploy:
    # Skip when the triggering CI run failed; tag/dispatch events pass through.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Match the production box's Ubuntu 24.04 glibc with a native GNU build.
    name: build x86_64 + ship to box
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI validated — workflow_run's default
          # github.sha is the default-branch tip, which may have moved.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Refuse a stale main deployment
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          VALIDATED_SHA="$(git rev-parse HEAD)"
          test "$VALIDATED_SHA" = "$MAIN_SHA" || {
            echo "main advanced from $VALIDATED_SHA to $MAIN_SHA; skipping stale deploy"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build web bundle (wasm + vite)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web run build:wasm
          pnpm --filter web run build

      - name: Build ppu-server (x86_64 release)
        run: cargo build --release --locked --bin ppu-server

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ship + swap + restart (keep previous binary for rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          BIN=target/release/ppu-server
          KEY=~/.ssh/id_ed25519
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp -i "$KEY" "$BIN" "${TARGET}:/tmp/ppu-server.new"
          scp -i "$KEY" -r web/dist "${TARGET}:/tmp/ppu-web-dist"
          scp -i "$KEY" deploy/Caddyfile "${TARGET}:/tmp/Caddyfile.new"
          ssh -i "$KEY" "$TARGET" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          caddy validate --config /tmp/Caddyfile.new --adapter caddyfile
          # Keep the currently-running binary for a one-command rollback.
          if [ -f /opt/ppu/ppu-server ]; then
            cp -a /opt/ppu/ppu-server /opt/ppu/ppu-server.prev
          fi
          install -o ppu -g ppu -m 0755 /tmp/ppu-server.new /opt/ppu/ppu-server
          rm -f /tmp/ppu-server.new
          # Replace the web bundle.
          rm -rf /opt/ppu/web/dist
          install -d -o ppu -g ppu -m 0755 /opt/ppu/web
          cp -a /tmp/ppu-web-dist /opt/ppu/web/dist
          chown -R ppu:ppu /opt/ppu/web/dist
          rm -rf /tmp/ppu-web-dist
          cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.prev
          install -o root -g root -m 0644 /tmp/Caddyfile.new /etc/caddy/Caddyfile
          rm -f /tmp/Caddyfile.new
          systemctl restart ppu-server
          systemctl reload caddy
          systemctl --no-pager --lines=0 status ppu-server
          curl --fail --silent --show-error --retry 5 --retry-delay 1 \
            http://127.0.0.1:8080/api/health
          REMOTE
