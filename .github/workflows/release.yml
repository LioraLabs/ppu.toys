name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Every version claim agrees
        run: python3 scripts/check-version-sync.py
      - name: Tag must match the crate version
        run: |
          MANIFEST=$(cargo metadata --format-version 1 --no-deps \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="ppu-cli"))')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $TAG but Cargo.toml says $MANIFEST"
            exit 1
          fi
          echo "version $MANIFEST matches tag $GITHUB_REF_NAME"
      # No cargo test here: the private monorepo's merge gate tested this exact tree before the mirror.

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ppu-cli
      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          PPU="target/${{ matrix.target }}/release/ppu.exe"
          "$PPU" new smoke
          sed -i 's/$/\r/' smoke/main.luau   # a toy saved with CRLF line endings
          "$PPU" check smoke --duration 2
          "$PPU" render 'smoke\' --at 1 -o 'frames\one'
          test -f frames/one/frame-00000060.png
          "$PPU" pack smoke -o smoke.ppu.json
          "$PPU" unpack smoke.ppu.json unpacked
          "$PPU" check smoke.ppu.json --duration 2
          cmp smoke/main.luau unpacked/main.luau
      - name: Package
        shell: bash
        run: |
          # Windows gets a zip with ppu.exe and ppu-link.exe (the ppu:// handler); everything else a tarball.
          archive() {
            if [ "$RUNNER_OS" = Windows ]; then 7z a "$1.zip" "$1" > /dev/null; else tar czf "$1.tar.gz" "$1"; fi
          }
          BIN=ppu; [ "$RUNNER_OS" = Windows ] && BIN="ppu.exe ppu-link.exe"
          ARCHIVE="ppu-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$ARCHIVE"
          for b in $BIN; do cp "target/${{ matrix.target }}/release/$b" "$ARCHIVE/"; done
          cp README.md LICENSE "$ARCHIVE/"
          archive "$ARCHIVE"
          # The same contents under a versionless name, so a consumer can fetch
          # releases/latest/download/ppu-<target>.tar.gz (or .zip) without asking an
          # API which version "latest" is. SHA256SUMS covers both names.
          ALIAS="ppu-${{ matrix.target }}"
          mv "$ARCHIVE" "$ALIAS"
          archive "$ALIAS"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz *.zip | tee SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ppu $GITHUB_REF_NAME" \
            --generate-notes \
            *.tar.gz *.zip SHA256SUMS
