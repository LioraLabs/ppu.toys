name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-version-sync.py
      - run: cargo fmt -p ppu-core -p ppu-cli --check
      - run: cargo test --workspace --locked

  # Prove ppu-cli still builds on Windows before a release tag finds out. Build only: the tests' fixtures check out with CRLF there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ppu-cli --locked
